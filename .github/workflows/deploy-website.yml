name: Deploy website

on:
  push:
    branches: [main, website/sanatan-sadhak-site]
    paths: ['public/**', 'firebase.json', 'firestore.rules', '.github/workflows/deploy-website.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/420062423164/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@sanatan-sadhak.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Firebase Hosting (sanatan-sadhak.chaloone.com)
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project sanatan-sadhak --non-interactive
