name: App smoke test (emulator screenshots)

on:
  workflow_dispatch:
  push:
    branches: [fix/production-pass]
    paths-ignore: ['public/**', 'website/**', '*.md']

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '9.3.1' }
      - name: Signing key + build
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          gradle :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/*.apk
            bash scripts/smoke_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-shots, path: shots/ }
      - name: Save screenshots to the smoke-shots branch
        if: always()
        run: |
          cd shots && git init -q -b smoke-shots && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "shots ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" smoke-shots
