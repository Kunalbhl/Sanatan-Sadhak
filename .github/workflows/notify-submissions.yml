name: Email new submissions

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: { group: notify-submissions }

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/420062423164/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@sanatan-sadhak.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Send emails
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 scripts/notify_submissions.py
